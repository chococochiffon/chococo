services:
  nuxt-app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    volumes:
      - ../src:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    tty: true
    # SSR 時にコンテナからホストで動いている biscuit(80番ポート)へつなぐため
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      # SSR 時(Nuxt サーバー → biscuit)の API のベース URL
      - NUXT_API_BASE=http://host.docker.internal/api
      # ブラウザ → biscuit の API のベース URL
      - NUXT_PUBLIC_API_BASE=http://localhost/api
      - NUXT_PUBLIC_SITE_URL=http://localhost:3000
